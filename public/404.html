<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>React Learn Lab</title>
    <script>
      // GitHub Pages has no server-side routing, so deep links 404.
      // This redirects back to index.html, encoding the original path
      // in the query string so the app can restore it on load.
      var pathSegmentsToKeep = 1 // keeps "/react-learn-lab"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?p=/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
